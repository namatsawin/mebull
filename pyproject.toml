[project]
name = "apm"
version = "0.1.0"
description = "Autonomous AI Portfolio Manager — one persistent Claude identity managing one real Webull portfolio."
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    # AI provider (sanctioned path for always-on automation: pay-per-token API key)
    "anthropic>=0.40",
    # Persistence
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # Config / validation
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Observability
    "structlog>=24.1",
    "prometheus-client>=0.20",
    # Health endpoint + async HTTP
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
# The official Webull SDK is wired in at milestone M1. Kept optional so the M0
# scaffold builds cleanly before the broker integration lands.
#   pip install webull-openapi-python-sdk   (repo: webull-inc/openapi-python-sdk)
webull = [
    "webull-openapi-python-sdk",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
apm = "apm.orchestrator.main:run"
apm-killswitch = "apm.tools.killswitch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
packages = ["apm"]
mypy_path = "src"
ignore_missing_imports = true
